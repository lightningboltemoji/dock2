[package]
name = "dockwasm"
version = "0.1.0"
edition = "2024"
description = "dock2's plugin engine: a narrow C ABI over wasmtime, plugins compiled to native code"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
wasmtime = { version = "=49.0.4", default-features = false, features = ["runtime", "std", "cranelift", "parallel-compilation"] }
libc = "0.2"
sha2 = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = false

[profile.dock2]
inherits = "release"
opt-level = "s"
